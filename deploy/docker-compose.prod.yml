# Pharma.ai sur un serveur (VPS) — trois services :
#   caddy    : HTTPS automatique pour pharmaboost.app (certificats Let's Encrypt)
#   app      : l'application Next.js (image construite depuis le Dockerfile)
#   db       : PostgreSQL 16, données sur un volume
#   suivis   : la tâche planifiée qui envoie les suivis arrivés à échéance
#
# Lancement :  docker compose -f deploy/docker-compose.prod.yml --env-file .env.production up -d --build
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ../.env.production
    environment:
      DATABASE_URL: postgresql://pharma:${POSTGRES_PASSWORD}@db:5432/pharma_ai?schema=public
      STORAGE_PROVIDER: local
      STORAGE_LOCAL_PATH: /app/storage
    volumes:
      - storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3000"

  suivis:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ../.env.production
    environment:
      DATABASE_URL: postgresql://pharma:${POSTGRES_PASSWORD}@db:5432/pharma_ai?schema=public
    entrypoint: ["/bin/sh", "-c"]
    # Toutes les heures : les suivis dont la date est passée partent, avec les
    # mêmes règles qu'au comptoir (consentement, désinscription, plafond).
    command: ["while true; do npm run followup:run; sleep 3600; done"]
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pharma
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: pharma_ai
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pharma -d pharma_ai"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  storage:
  caddy_data:
  caddy_config:
